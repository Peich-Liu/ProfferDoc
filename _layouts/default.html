<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <meta name="description" content="{{ page.description | default: site.description | escape }}">
    <title>{% if page.title %}{{ page.title }} - {% endif %}{{ site.title }}</title>
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  </head>
  <body data-baseurl="{{ site.baseurl }}">
    <a class="skip-link" href="#main-content">Skip to main content</a>

    <header class="topbar" aria-label="Site header">
      <button class="icon-button menu-toggle" type="button" aria-label="Open navigation" aria-controls="site-sidebar" aria-expanded="false">
        <span aria-hidden="true"></span>
      </button>
      <a class="brand" href="{{ '/' | relative_url }}">{{ site.title }}</a>
      <div class="topbar-actions">
        <button class="search-trigger" type="button" aria-label="Focus search">
          <span aria-hidden="true">Search</span>
          <kbd>/</kbd>
        </button>
        <button class="icon-button theme-toggle" type="button" aria-label="Toggle color theme">
          <span aria-hidden="true">◐</span>
        </button>
      </div>
    </header>

    <div class="site-shell">
      <aside class="sidebar" id="site-sidebar" aria-label="Primary navigation">
        {% include nav.html %}
      </aside>

      <main class="main" id="main-content" tabindex="-1">
        <article class="article">
          {{ content }}
        </article>

      </main>

      {% if page.toc %}
        <aside class="toc" aria-label="Page contents">
          <div class="toc-inner">
            <p class="toc-title">On this page</p>
            <nav>
              <ul>
                {% for item in page.toc %}
                  <li><a href="{{ item.url }}">{{ item.title }}</a></li>
                {% endfor %}
              </ul>
            </nav>
          </div>
        </aside>
      {% endif %}
    </div>

    <div class="backdrop" data-backdrop hidden></div>
    <script src="{{ '/assets/site.js' | relative_url }}" defer></script>
  </body>
</html>
